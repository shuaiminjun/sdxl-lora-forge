[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdxl-lora-forge"
version = "0.1.0"
description = "Small-dataset LoRA training for SDXL-class models: dataset QC, caption synthesis, sd-scripts command builder, and a VRAM feasibility estimator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HsM" }]
keywords = ["lora", "sdxl", "kohya", "dataset", "training", "image-generation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
image = ["Pillow>=9"]
dev = ["pytest>=8"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]
